name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/antics-macos-arm64 ./cmd/
          GOOS=darwin GOARCH=amd64 go build -o dist/antics-macos-intel ./cmd/
          GOOS=linux  GOARCH=amd64 go build -o dist/antics-linux-amd64 ./cmd/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
